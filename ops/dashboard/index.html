<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🦜 Agent Company Dashboard</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro',system-ui,sans-serif;background:#0a0a0f;color:#e0e0e0;min-height:100vh}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#333;border-radius:2px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React

const DEPTS = [
  {name:'Executive',icon:'🎯',color:'#22c55e',agents:[
    {name:'Claw',model:'Opus',cadence:'always',role:'Co-CEO',status:'green'},
    {name:'Chief of Staff',model:'Opus',cadence:'20m',role:'Gap Finder'},
  ]},
  {name:'Product',icon:'📋',color:'#3b82f6',agents:[
    {name:'DocBot',model:'Kimi',cadence:'20m',role:'Tech Writer'},
    {name:'SpecBot',model:'Kimi',cadence:'30m',role:'Requirements'},
  ]},
  {name:'Engineering',icon:'⚙️',color:'#8b5cf6',agents:[
    {name:'DC Manager',model:'Kimi',cadence:'30m',role:'DevOps Lead'},
    {name:'FrontEndBot',model:'Kimi',cadence:'30m',role:'DA Frontend'},
    {name:'BHABot',model:'Kimi',cadence:'30m',role:'BHA Stack'},
    {name:'RailwayBot',model:'Kimi',cadence:'20m',role:'Infra'},
  ]},
  {name:'Operations',icon:'🔒',color:'#f59e0b',agents:[
    {name:'Kimi Patrol',model:'Kimi',cadence:'5m',role:'Fast Ops'},
    {name:'Sentry',model:'Sonnet',cadence:'15m',role:'Security'},
  ]},
  {name:'Revenue',icon:'💰',color:'#10b981',agents:[
    {name:'StripeBot',model:'Kimi',cadence:'30m',role:'Payments'},
    {name:'PoeBot',model:'Kimi',cadence:'30m',role:'Bot Growth'},
  ]},
  {name:'Customer Success',icon:'🤝',color:'#ec4899',agents:[
    {name:'UserHealthBot',model:'Kimi',cadence:'20m',role:'User Health'},
    {name:'OnboardBot',model:'Kimi',cadence:'30m',role:'Onboarding'},
  ]},
  {name:'Marketing',icon:'📣',color:'#f97316',agents:[
    {name:'ContentBot',model:'Sonnet',cadence:'20m',role:'Creator'},
    {name:'SocialBot',model:'Kimi',cadence:'30m',role:'Social'},
    {name:'SEOBot',model:'Kimi',cadence:'30m',role:'Search'},
  ]},
  {name:'Communications',icon:'📡',color:'#06b6d4',agents:[
    {name:'FounderVoice',model:'Sonnet',cadence:'30m',role:'Voice Guard'},
  ]},
  {name:'Intelligence',icon:'🧠',color:'#a855f7',agents:[
    {name:'Researcher',model:'Sonnet',cadence:'10m',role:'Intel Engine'},
    {name:'Wire',model:'Kimi',cadence:'15m',role:'News Feed'},
    {name:'ContentPitch',model:'Kimi',cadence:'30m',role:'Pitches'},
    {name:'PatternBot',model:'Kimi',cadence:'30m',role:'Patterns'},
  ]},
  {name:'Meta',icon:'⚡',color:'#ef4444',agents:[
    {name:'Opus Strategy',model:'Opus',cadence:'15m',role:'Quality Gate'},
    {name:'Meta',model:'Sonnet',cadence:'20m',role:'Grader'},
    {name:'Governance',model:'Sonnet',cadence:'30m',role:'Constitution'},
    {name:'Archivist',model:'Kimi',cadence:'20m',role:'Backup'},
    {name:'LearningBot',model:'Kimi',cadence:'30m',role:'Lessons'},
  ]},
]

const PIPE = ['Drop/Idea','Wire','Pitch','Spec','Task','Code','PR','Ship','Docs','Backup']
const mc = m => m==='Opus'?'#f59e0b':m==='Sonnet'?'#3b82f6':'#22c55e'
const sc = s => ({green:'#22c55e',yellow:'#eab308',red:'#ef4444'}[s]||'#444')

function Dept({d}) {
  const [open,setOpen] = useState(true)
  return <div style={{background:'#12121a',border:'1px solid #1e1e2e',borderRadius:10,padding:12,borderLeft:`3px solid ${d.color}`}}>
    <div onClick={()=>setOpen(!open)} style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer',marginBottom:open?8:0}}>
      <span style={{fontSize:14}}>{d.icon}</span>
      <span style={{fontSize:12,fontWeight:600,color:'#ccc',flex:1}}>{d.name}</span>
      <span style={{fontSize:9,color:'#555'}}>{d.agents.length}</span>
    </div>
    {open && d.agents.map((a,i) => <div key={i} style={{display:'flex',alignItems:'center',gap:6,padding:'4px 6px',borderRadius:5,fontSize:10,marginBottom:2}}>
      <div style={{width:7,height:7,borderRadius:'50%',background:sc(a.status),boxShadow:a.status==='green'?'0 0 6px #22c55e44':'none',flexShrink:0}}/>
      <span style={{color:'#aaa',flex:1}}>{a.name}</span>
      <span style={{color:'#666',fontSize:8}}>{a.role}</span>
      <span style={{color:mc(a.model),fontSize:8,fontWeight:600}}>{a.model}</span>
      <span style={{color:'#444',fontSize:8,fontFamily:'monospace'}}>{a.cadence}</span>
    </div>)}
  </div>
}

function Chat() {
  const [open,setOpen] = useState(false)
  const [msgs,setMsgs] = useState([{from:'claw',text:'Hey Joey 🦜 Dashboard is live. Chat with me here — wire this to the gateway webhook for real responses.'}])
  const [input,setInput] = useState('')
  const ref = useRef()
  useEffect(()=>{ref.current?.scrollIntoView({behavior:'smooth'})},[msgs])
  const send = () => {
    if(!input.trim())return
    setMsgs(p=>[...p,{from:'joey',text:input}])
    setInput('')
    setTimeout(()=>setMsgs(p=>[...p,{from:'claw',text:'🦜 Connect this to POST /hooks/agent with OPENCLAW_HOOK_TOKEN for live responses!'}]),800)
  }
  if(!open) return <div onClick={()=>setOpen(true)} style={{position:'fixed',bottom:20,right:20,width:50,height:50,borderRadius:'50%',background:'linear-gradient(135deg,#22c55e,#10b981)',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',boxShadow:'0 4px 20px #22c55e44',fontSize:24,zIndex:999}}>🦜</div>
  return <div style={{position:'fixed',bottom:20,right:20,width:340,height:420,background:'#12121a',border:'1px solid #2a2a3e',borderRadius:12,display:'flex',flexDirection:'column',boxShadow:'0 8px 40px #00000088',zIndex:999}}>
    <div style={{padding:'10px 14px',borderBottom:'1px solid #1e1e2e',display:'flex',alignItems:'center',gap:8}}>
      <span>🦜</span><span style={{fontSize:12,fontWeight:600,color:'#ccc',flex:1}}>Claw</span>
      <span onClick={()=>setOpen(false)} style={{cursor:'pointer',color:'#555',fontSize:18}}>×</span>
    </div>
    <div style={{flex:1,overflow:'auto',padding:10}}>
      {msgs.map((m,i)=><div key={i} style={{marginBottom:8,textAlign:m.from==='joey'?'right':'left'}}>
        <div style={{display:'inline-block',maxWidth:'80%',padding:'6px 10px',borderRadius:8,fontSize:11,background:m.from==='joey'?'#22c55e22':'#1e1e2e',color:m.from==='joey'?'#22c55e':'#aaa'}}>{m.text}</div>
      </div>)}
      <div ref={ref}/>
    </div>
    <div style={{padding:8,borderTop:'1px solid #1e1e2e',display:'flex',gap:6}}>
      <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()} placeholder="Message Claw..." style={{flex:1,background:'#1a1a2a',border:'1px solid #2a2a3e',borderRadius:6,padding:'6px 10px',color:'#ccc',fontSize:11,outline:'none'}}/>
      <button onClick={send} style={{background:'#22c55e',border:'none',borderRadius:6,padding:'6px 12px',color:'#000',fontSize:11,fontWeight:600,cursor:'pointer'}}>→</button>
    </div>
  </div>
}

function App() {
  const [now,setNow] = useState(new Date())
  useEffect(()=>{const t=setInterval(()=>setNow(new Date()),30000);return()=>clearInterval(t)},[])
  const total = DEPTS.reduce((s,d)=>s+d.agents.length,0)
  return <div style={{padding:20}}>
    <h1 style={{fontSize:18,color:'#fff',marginBottom:2}}>🦜 DropAnywhere Agent Company</h1>
    <p style={{fontSize:10,color:'#555',marginBottom:16}}>{now.toISOString().slice(0,16)} UTC — Live Dashboard</p>
    
    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(90px,1fr))',gap:8,marginBottom:16}}>
      {[{v:total,l:'AGENTS',c:'#22c55e'},{v:10,l:'DEPTS',c:'#fff'},{v:'~1.5K',l:'CYCLES/DAY',c:'#22c55e'},{v:3,l:'MODELS',c:'#fff'},{v:'8d',l:'TO LAUNCH',c:'#eab308'}].map((s,i)=>
        <div key={i} style={{background:'#12121a',border:'1px solid #1e1e2e',borderRadius:8,padding:8,textAlign:'center'}}>
          <div style={{fontSize:20,fontWeight:700,color:s.c}}>{s.v}</div>
          <div style={{fontSize:8,color:'#555'}}>{s.l}</div>
        </div>
      )}
    </div>
    
    <div style={{display:'flex',gap:12,marginBottom:12,fontSize:9}}>
      <span><span style={{color:'#f59e0b'}}>●</span> Opus</span>
      <span><span style={{color:'#3b82f6'}}>●</span> Sonnet</span>
      <span><span style={{color:'#22c55e'}}>●</span> Kimi</span>
      <span style={{marginLeft:'auto',color:'#444'}}>🟢 ok · 🟡 slow · 🔴 error · ⚫ pending</span>
    </div>
    
    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))',gap:8,marginBottom:16}}>
      {DEPTS.map((d,i)=><Dept key={i} d={d}/>)}
    </div>
    
    <div style={{fontSize:12,fontWeight:600,color:'#666',marginBottom:6}}>🔄 Value Pipeline</div>
    <div style={{display:'flex',alignItems:'center',gap:3,flexWrap:'wrap',background:'#12121a',border:'1px solid #1e1e2e',borderRadius:8,padding:10,marginBottom:16}}>
      {PIPE.map((p,i)=><React.Fragment key={i}>
        <span style={{color:'#22c55e',background:'#0f1f0f',padding:'3px 7px',borderRadius:4,fontSize:9,border:'1px solid #22c55e22'}}>{p}</span>
        {i<PIPE.length-1&&<span style={{color:'#333',fontSize:9}}>→</span>}
      </React.Fragment>)}
    </div>
    
    <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8,marginBottom:16}}>
      {[{m:'Kimi K2.5',t:'120s',n:18,c:'#22c55e',d:'Fast ops'},{m:'Sonnet',t:'240s',n:5,c:'#3b82f6',d:'Build/research'},{m:'Opus',t:'300-420s',n:2,c:'#f59e0b',d:'Strategy'}].map((t,i)=>
        <div key={i} style={{background:'#12121a',border:`1px solid ${t.c}22`,borderRadius:8,padding:10}}>
          <div style={{fontSize:14,fontWeight:700,color:t.c}}>{t.m}</div>
          <div style={{fontSize:10,color:'#888',marginTop:2}}>{t.n} agents · {t.t}</div>
          <div style={{fontSize:9,color:'#555',marginTop:2}}>{t.d}</div>
        </div>
      )}
    </div>
    
    <div style={{display:'flex',gap:6,marginBottom:16,fontSize:9,flexWrap:'wrap'}}>
      <span style={{background:'#2a0a0a',color:'#ef4444',padding:'3px 8px',borderRadius:4}}>🔴 RESTRICTED</span>
      <span style={{background:'#2a1a0a',color:'#f59e0b',padding:'3px 8px',borderRadius:4}}>🟠 CONFIDENTIAL</span>
      <span style={{background:'#1a1a0a',color:'#eab308',padding:'3px 8px',borderRadius:4}}>🟡 INTERNAL</span>
      <span style={{background:'#0a1a0a',color:'#22c55e',padding:'3px 8px',borderRadius:4}}>🟢 PUBLIC</span>
    </div>
    
    <Chat/>
  </div>
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>)
</script>
</body>
</html>
