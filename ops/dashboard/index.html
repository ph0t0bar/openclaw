const {useState,useEffect,useRef,useCallback} = React

// CONFIG — point these at your gateway
const GATEWAY = 'https://openclaw-gateway-production-54a0.up.railway.app'
const HUB = 'https://hub-production-f423.up.railway.app'
const GITHUB_REPO = 'ph0t0bar/joey-backup'

// Fetch agent status from GitHub (private repo — needs token)
async function fetchAgentStatus(token) {
  if (!token) return null
  try {
    const r = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/dashboard/agent-status.json`, {headers:{'Authorization':'token '+token}})
    if (r.ok) {
      const d = await r.json()
      return JSON.parse(atob(d.content))
    }
  } catch(e) {}
  return null
}

// Fetch Hub dashboard
async function fetchDailyLog() {
  try {
    const r = await fetch(`${HUB}/api/ops/dashboard`)
    if (r.ok) return await r.json()
  } catch(e) {}
  return null
}

// Fetch latest commits (proxy for activity)
async function fetchActivity(token) {
  try {
    const headers = token ? {'Authorization':'token '+token} : {}
    const r = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/commits?per_page=20`, {headers})
    if (r.ok) return await r.json()
  } catch(e) {}
  return []
}

const mc = m => m==='Opus'?'#f59e0b':m==='Sonnet'?'#3b82f6':'#22c55e'

function Dept({d, activity, agentStatus}) {
  const [open,setOpen] = useState(true)
  const getAgentData = (name) => {
    if (!agentStatus?.agents) return null
    return agentStatus.agents.find(a => name.toLowerCase().includes(a.name.toLowerCase()) || a.name.toLowerCase().includes(name.toLowerCase().replace('bot','')))
  }
  const agentActive = (name) => {
    const data = getAgentData(name)
    if (data) return data.status === 'active' ? 'green' : data.status === 'error' ? 'red' : 'pending'
    if (!activity?.length) return 'pending'
    const recent = activity.slice(0,10).map(a=>a?.commit?.message||'').join(' ').toLowerCase()
    return recent.includes(name.toLowerCase()) ? 'green' : 'pending'
  }
  const sc = s => ({green:'#22c55e',yellow:'#eab308',red:'#ef4444'}[s]||'#333')
  
  return <div style={{background:'#12121a',border:'1px solid #1e1e2e',borderRadius:10,padding:12,borderLeft:`3px solid ${d.color}`,transition:'all .2s'}}>
    <div onClick={()=>setOpen(!open)} style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer',marginBottom:open?8:0}}>
      <span style={{fontSize:14}}>{d.icon}</span>
      <span style={{fontSize:12,fontWeight:600,color:'#ccc',flex:1}}>{d.name}</span>
      <span style={{fontSize:9,color:'#555'}}>{d.agents.length}</span>
      <span style={{fontSize:10,color:'#444'}}>{open?'▾':'▸'}</span>
    </div>
    {open && d.agents.map((a,i) => {
      const st = agentActive(a.name)
      const data = getAgentData(a.name)
      const cycles = data?.cycles_today || 0
      const sr = data?.success_rate
      return <div key={i} style={{display:'flex',alignItems:'center',gap:6,padding:'4px 6px',borderRadius:5,fontSize:10,marginBottom:2}} title={data?.last_output||'No output yet'}>
        <div className={st==='green'?'pulse':''} style={{width:7,height:7,borderRadius:'50%',background:sc(st),boxShadow:st==='green'?'0 0 8px #22c55e55':'none',flexShrink:0}}/>
        <span style={{color:st==='green'?'#ddd':'#777',flex:1,fontWeight:st==='green'?500:400}}>{a.name}</span>
        {cycles>0 && <span style={{color:'#555',fontSize:8}}>{cycles}x</span>}
        {sr!==null && sr!==undefined && <span style={{color:sr>=80?'#22c55e':sr>=50?'#eab308':'#ef4444',fontSize:8}}>{sr}%</span>}
        <span style={{color:mc(a.model),fontSize:8,fontWeight:600}}>{a.model}</span>
        <span style={{color:'#444',fontSize:8,fontFamily:'monospace'}}>{a.cadence}</span>
      </div>
    })}
  </div>
}

function ActivityFeed({activity}) {
  if (!activity?.length) return <div style={{color:'#444',fontSize:11,padding:20,textAlign:'center'}}>Loading activity...</div>
  return <div style={{maxHeight:300,overflow:'auto'}}>
    {activity.map((c,i) => {
      const msg = c?.commit?.message || '?'
      const time = c?.commit?.author?.date || ''
      const short = time.slice(11,16)
      const agent = msg.split(':')[0] || '?'
      const detail = msg.split(':').slice(1).join(':').trim().slice(0,80)
      // Color by agent type
      const agentColor = msg.includes('opus')||msg.includes('strategy')||msg.includes('gap') ? '#f59e0b'
        : msg.includes('research')||msg.includes('content')||msg.includes('sonnet')||msg.includes('security')||msg.includes('meta')||msg.includes('governance') ? '#3b82f6'
        : msg.includes('archivist')||msg.includes('patrol')||msg.includes('wire') ? '#22c55e'
        : '#666'
      return <div key={i} className="slide-in" style={{display:'flex',gap:8,padding:'6px 0',borderBottom:'1px solid #1a1a2a',fontSize:10}}>
        <span style={{color:'#444',fontFamily:'monospace',minWidth:40}}>{short}</span>
        <span style={{color:agentColor,minWidth:65,fontWeight:500}}>{agent.slice(0,12)}</span>
        <span style={{color:'#777',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{detail||msg}</span>
      </div>
    })}
  </div>
}

function HubStats({stats}) {
  if (!stats) return null
  return <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(80px,1fr))',gap:6,marginBottom:16}}>
    {Object.entries(stats).slice(0,8).map(([k,v],i) => 
      <div key={i} style={{background:'#12121a',border:'1px solid #1e1e2e',borderRadius:6,padding:6,textAlign:'center'}}>
        <div style={{fontSize:14,fontWeight:700,color:typeof v==='number'&&v>0?'#22c55e':'#fff'}}>{typeof v==='object'?'—':String(v).slice(0,8)}</div>
        <div style={{fontSize:7,color:'#555',marginTop:1}}>{k.replace(/_/g,' ').toUpperCase()}</div>
      </div>
    )}
  </div>
}

function Chat() {
  const [open,setOpen] = useState(false)
  const [msgs,setMsgs] = useState([{from:'claw',text:'Hey Joey 🦜 Type a message — it goes to my inbox via GitHub. I check every 2 min and respond here.'}])
  const [input,setInput] = useState('')
  const [ghToken,setGhToken] = useState(localStorage.getItem('gh_token')||'')
  const [showAuth,setShowAuth] = useState(!localStorage.getItem('gh_token'))
  const ref = useRef()
  useEffect(()=>{ref.current?.scrollIntoView({behavior:'smooth'})},[msgs])
  
  // Poll outbox for Claw's responses
  useEffect(()=>{
    if(!ghToken) return
    const poll = async()=>{
      try {
        const r = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/dashboard/dashboard-outbox.json`,{headers:{'Authorization':'token '+ghToken}})
        if(r.ok){
          const d = await r.json()
          const outbox = JSON.parse(atob(d.content))
          if(outbox.messages?.length){
            const newMsgs = outbox.messages.filter(m=>!m.shown)
            if(newMsgs.length){
              setMsgs(p=>[...p,...newMsgs.map(m=>({from:'claw',text:m.text}))])
              // Mark as shown
              outbox.messages.forEach(m=>m.shown=true)
              const updated = btoa(JSON.stringify(outbox))
              await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/dashboard/dashboard-outbox.json`,{
                method:'PUT',headers:{'Authorization':'token '+ghToken,'Content-Type':'application/json'},
                body:JSON.stringify({message:'mark shown',content:updated,sha:d.sha})
              })
            }
          }
        }
      }catch(e){}
    }
    poll()
    const t = setInterval(poll, 30000)
    return ()=>clearInterval(t)
  },[ghToken])
  
  const send = async () => {
    if(!input.trim()||!ghToken)return
    const msg = input
    setMsgs(p=>[...p,{from:'joey',text:msg}])
    setInput('')
    try {
      // Read current inbox
      const r = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/dashboard/dashboard-inbox.json`,{headers:{'Authorization':'token '+ghToken}})
      const d = await r.json()
      const inbox = JSON.parse(atob(d.content))
      inbox.messages.push({text:msg, time:new Date().toISOString(), read:false})
      const updated = btoa(JSON.stringify(inbox))
      await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/dashboard/dashboard-inbox.json`,{
        method:'PUT',headers:{'Authorization':'token '+ghToken,'Content-Type':'application/json'},
        body:JSON.stringify({message:'dashboard msg: '+msg.slice(0,30),content:updated,sha:d.sha})
      })
      setMsgs(p=>[...p,{from:'claw',text:'📨 Sent to Claw\'s inbox. Response within 2 min.'}])
    } catch(e) {
      setMsgs(p=>[...p,{from:'claw',text:'❌ Failed to send: '+e.message}])
    }
  }
  
  const saveToken = () => { localStorage.setItem('gh_token',ghToken); setShowAuth(false) }
  if(!open) return <div onClick={()=>setOpen(true)} style={{position:'fixed',bottom:16,right:16,width:48,height:48,borderRadius:'50%',background:'linear-gradient(135deg,#22c55e,#10b981)',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',boxShadow:'0 4px 24px #22c55e33',fontSize:22,zIndex:999,transition:'transform .2s'}} onMouseOver={e=>e.target.style.transform='scale(1.1)'} onMouseOut={e=>e.target.style.transform='scale(1)'}>🦜</div>
  return <div style={{position:'fixed',bottom:16,right:16,width:320,height:400,background:'#0d0d15',border:'1px solid #2a2a3e',borderRadius:14,display:'flex',flexDirection:'column',boxShadow:'0 8px 40px #00000088',zIndex:999}}>
    <div style={{padding:'10px 14px',borderBottom:'1px solid #1e1e2e',display:'flex',alignItems:'center',gap:8,background:'#12121a',borderRadius:'14px 14px 0 0'}}>
      <span>🦜</span><span style={{fontSize:12,fontWeight:600,color:'#ccc',flex:1}}>Claw</span>
      <div className="pulse" style={{width:6,height:6,borderRadius:'50%',background:ghToken?'#22c55e':'#ef4444'}}/>
      <span onClick={()=>setShowAuth(!showAuth)} style={{cursor:'pointer',color:'#555',fontSize:10}}>⚙</span>
      <span onClick={()=>setOpen(false)} style={{cursor:'pointer',color:'#555',fontSize:16,marginLeft:2}}>×</span>
    </div>
    {showAuth && <div style={{padding:8,borderBottom:'1px solid #1e1e2e',background:'#0d0d12'}}>
      <div style={{fontSize:9,color:'#666',marginBottom:4}}>GitHub PAT (repo scope, for joey-backup access):</div>
      <div style={{display:'flex',gap:4}}>
        <input type="password" value={ghToken} onChange={e=>setGhToken(e.target.value)} placeholder="ghp_..." style={{flex:1,background:'#1a1a2a',border:'1px solid #2a2a3e',borderRadius:6,padding:'5px 8px',color:'#ccc',fontSize:10,outline:'none'}}/>
        <button onClick={saveToken} style={{background:'#22c55e',border:'none',borderRadius:6,padding:'5px 10px',color:'#000',fontSize:9,fontWeight:600,cursor:'pointer'}}>Save</button>
      </div>
      <div style={{fontSize:8,color:'#444',marginTop:3}}>Stored in localStorage only. Never sent anywhere except GitHub API.</div>
    </div>}
    <div style={{flex:1,overflow:'auto',padding:10}}>
      {msgs.map((m,i)=><div key={i} className="slide-in" style={{marginBottom:8,textAlign:m.from==='joey'?'right':'left'}}>
        <div style={{display:'inline-block',maxWidth:'85%',padding:'7px 11px',borderRadius:m.from==='joey'?'10px 10px 2px 10px':'10px 10px 10px 2px',fontSize:11,lineHeight:1.4,background:m.from==='joey'?'#22c55e18':'#1a1a2a',color:m.from==='joey'?'#22c55e':'#aaa',border:m.from==='joey'?'1px solid #22c55e22':'1px solid #222'}}>{m.text}</div>
      </div>)}
      <div ref={ref}/>
    </div>
    <div style={{padding:8,borderTop:'1px solid #1e1e2e',display:'flex',gap:6}}>
      <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()} placeholder={ghToken?'Talk to Claw...':'Set GitHub token first ↑'} disabled={!ghToken} style={{flex:1,background:'#1a1a2a',border:'1px solid #2a2a3e',borderRadius:8,padding:'7px 10px',color:'#ccc',fontSize:11,outline:'none',opacity:ghToken?1:0.5}}/>
      <button onClick={send} disabled={!ghToken} style={{background:ghToken?'#22c55e':'#333',border:'none',borderRadius:8,padding:'7px 14px',color:'#000',fontSize:11,fontWeight:600,cursor:'pointer'}}>↑</button>
    </div>
  </div>
}

function App() {
  const [activity, setActivity] = useState([])
  const [hubStats, setHubStats] = useState(null)
  const [lastRefresh, setLastRefresh] = useState(null)
  const [refreshing, setRefreshing] = useState(false)
  
  const [agentStatus, setAgentStatus] = useState(null)
  const ghToken = localStorage.getItem('gh_token') || ''
  
  const refresh = useCallback(async () => {
    setRefreshing(true)
    const [acts, hub, status] = await Promise.all([fetchActivity(ghToken), fetchDailyLog(), fetchAgentStatus(ghToken)])
    if (acts?.length) setActivity(acts)
    if (hub) setHubStats(hub)
    if (status) setAgentStatus(status)
    setLastRefresh(new Date())
    setRefreshing(false)
  }, [ghToken])
  
  useEffect(() => { refresh(); const t = setInterval(refresh, 60000); return () => clearInterval(t) }, [refresh])
  
  const total = DEPTS.reduce((s,d)=>s+d.agents.length,0)
  const launchDate = new Date('2026-03-24')
  const daysToLaunch = Math.max(0, Math.ceil((launchDate - new Date()) / 86400000))
  
  return <div style={{padding:16,maxWidth:1200,margin:'0 auto'}}>
    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:2}}>
      <h1 style={{fontSize:18,color:'#fff'}}>🦜 Agent Company</h1>
      <button onClick={refresh} style={{background:'none',border:'1px solid #333',borderRadius:6,padding:'2px 8px',color:refreshing?'#22c55e':'#555',fontSize:9,cursor:'pointer',marginLeft:'auto'}}>
        {refreshing ? '⟳ refreshing...' : '⟳ refresh'}
      </button>
    </div>
    <p style={{fontSize:10,color:'#444',marginBottom:14}}>
      {lastRefresh ? `Updated ${lastRefresh.toLocaleTimeString()}` : 'Loading...'} · Auto-refreshes every 60s
    </p>
    
    {/* Stats */}
    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(85px,1fr))',gap:6,marginBottom:14}}>
      {[
        {v:total,l:'AGENTS',c:'#22c55e'},
        {v:10,l:'DEPTS',c:'#fff'},
        {v:'~1.5K',l:'CYCLES/DAY',c:'#22c55e'},
        {v:daysToLaunch+'d',l:'TO LAUNCH',c:daysToLaunch<=7?'#ef4444':'#eab308'},
        {v:agentStatus?agentStatus.successRate+'%':'—',l:'SUCCESS RATE',c:agentStatus?.successRate>=80?'#22c55e':agentStatus?.successRate>=50?'#eab308':'#ef4444'},
        {v:agentStatus?.totalCycles||'—',l:'CYCLES TODAY',c:'#fff'},
      ].map((s,i)=>
        <div key={i} style={{background:'#12121a',border:'1px solid #1e1e2e',borderRadius:8,padding:'8px 4px',textAlign:'center'}}>
          <div style={{fontSize:18,fontWeight:700,color:s.c}}>{s.v}</div>
          <div style={{fontSize:8,color:'#555'}}>{s.l}</div>
        </div>
      )}
    </div>
    
    {/* Hub Stats (live from API) */}
    <HubStats stats={hubStats}/>
    
    {/* Legend */}
    <div style={{display:'flex',gap:10,marginBottom:10,fontSize:9,flexWrap:'wrap'}}>
      <span><span style={{color:'#f59e0b'}}>●</span> Opus</span>
      <span><span style={{color:'#3b82f6'}}>●</span> Sonnet</span>
      <span><span style={{color:'#22c55e'}}>●</span> Kimi</span>
      <span style={{color:'#444',marginLeft:'auto'}}>● active (in recent commits) · <span style={{color:'#333'}}>●</span> idle</span>
    </div>
    
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
      {/* LEFT: Org */}
      <div>
        <div style={{fontSize:12,fontWeight:600,color:'#666',marginBottom:6}}>🏢 Departments</div>
        <div style={{display:'grid',gap:6}}>
          {DEPTS.map((d,i)=><Dept key={i} d={d} activity={activity} agentStatus={agentStatus}/>)}
        </div>
      </div>
      
      {/* RIGHT: Activity */}
      <div>
        {/* Agent Output Feed */}
        {agentStatus?.recent?.length > 0 && <>
          <div style={{fontSize:12,fontWeight:600,color:'#666',marginBottom:6}}>🔥 Agent Output <span style={{fontSize:9,color:'#444'}}>(from daily log, real-time)</span></div>
          <div style={{background:'#12121a',border:'1px solid #1e1e2e',borderRadius:10,padding:10,marginBottom:12,maxHeight:250,overflow:'auto'}}>
            {agentStatus.recent.map((r,i) => <div key={i} style={{padding:'5px 0',borderBottom:'1px solid #1a1a2a',fontSize:10}}>
              <div style={{color:'#888',fontWeight:500,marginBottom:2}}>{r.header}</div>
              <div style={{color:'#555',fontSize:9,lineHeight:1.3}}>{r.snippet}</div>
            </div>)}
          </div>
        </>}
        
        <div style={{fontSize:12,fontWeight:600,color:'#666',marginBottom:6}}>📋 Git Activity <span style={{fontSize:9,color:'#444'}}>(commits)</span></div>
        <div style={{background:'#12121a',border:'1px solid #1e1e2e',borderRadius:10,padding:10,marginBottom:12}}>
          <ActivityFeed activity={activity}/>
        </div>
        
        <div style={{fontSize:12,fontWeight:600,color:'#666',marginBottom:6}}>🔄 Value Pipeline</div>
        <div style={{display:'flex',alignItems:'center',gap:3,flexWrap:'wrap',background:'#12121a',border:'1px solid #1e1e2e',borderRadius:8,padding:10,marginBottom:12}}>
          {['Drop','Wire','Pitch','Spec','Task','Code','PR','Ship','Docs','Backup'].map((p,i)=><React.Fragment key={i}>
            <span style={{color:'#22c55e',background:'#0f1f0f',padding:'3px 6px',borderRadius:4,fontSize:8,border:'1px solid #22c55e22'}}>{p}</span>
            {i<9&&<span style={{color:'#222',fontSize:8}}>→</span>}
          </React.Fragment>)}
        </div>
        
        <div style={{fontSize:12,fontWeight:600,color:'#666',marginBottom:6}}>⏱ DCS Tiers</div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:6}}>
          {[{m:'Kimi',t:'120s',n:18,c:'#22c55e'},{m:'Sonnet',t:'240s',n:5,c:'#3b82f6'},{m:'Opus',t:'420s',n:2,c:'#f59e0b'}].map((t,i)=>
            <div key={i} style={{background:'#12121a',border:`1px solid ${t.c}22`,borderRadius:6,padding:8,textAlign:'center'}}>
              <div style={{fontSize:12,fontWeight:700,color:t.c}}>{t.m}</div>
              <div style={{fontSize:9,color:'#666'}}>{t.n} · {t.t}</div>
            </div>
          )}
        </div>
      </div>
    </div>
    
    <Chat/>
  </div>
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>)
